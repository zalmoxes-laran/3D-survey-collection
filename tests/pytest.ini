[pytest]
# Plain pytest tests, no Blender:  pytest tests
# The ini lives here, not at the repo root, so rootdir is tests/: the repo root
# is the add-on package and its __init__ imports bpy, which pytest would import.
# The scripts in dev_utils/tests run inside Blender (dev_utils/tests/README.md).
addopts = --import-mode=importlib
